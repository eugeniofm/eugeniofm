{{- $target := .Params.external_link | default "/projects/" -}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
    <link rel="canonical" href="{{ $target | absURL }}">
    <title>Redirecting to Research</title>
  </head>
  <body>
    <p><a href="{{ $target }}">View this work on the Research page</a>.</p>
  </body>
</html>
