# Theme metadata
name = "EugenioFM"

[light]
  # Primary
  primary = "#AF9C73"

  # Menu
  menu_primary = "#AF9C73"
  menu_text = "#1f2933"
  menu_text_active = "#fff"
  menu_title = "#fff"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(255, 255, 255)"

[dark]
  # Use gold for links and accents against the dark background.
  primary = "#AF9C73"
  link = "#AF9C73"
  link_hover = "#AF9C73"

  # Dark surfaces
  menu_primary = "#333333"
  home_section_odd = "#333333"
  home_section_even = "#333333"
